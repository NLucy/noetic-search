[project]
name = "noetic-search"
version = "0.1.0"
description = "Post-retrieval graph reconciliation for hybrid search."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.0",
    "mkdocs>=1.6.1",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.68.0",
]
eval = [
    "datasets>=3.0.0",
]

[project.scripts]
noetic = "noetic_systems.cli:main"

[tool.uv]
package = true
