<svg style="font-family:sans-serif" xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-label="Normal RAG compared to Noetic reconciliation">
  <defs>
    <style>
      .bg{fill:#fff}.box{fill:#f8fafc;stroke:#1f2937;stroke-width:1.4}.soft{fill:#eef2ff;stroke:#3730a3}.accent{fill:#ecfeff;stroke:#0e7490}.warn{fill:#fff7ed;stroke:#c2410c}.text{font-family:sans-serif;fill:#111827;font-size:18px}.small{font-size:14px;fill:#374151}.title{font-size:22px;font-weight:700}.arrow{stroke:#111827;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker>
  </defs>
  <rect class="bg" width="980" height="360"/>
  <text font-family="sans-serif" x="40" y="44" class="text title">Normal RAG</text>
  <rect x="40" y="80" width="145" height="70" rx="8" class="box"/><text font-family="sans-serif" x="72" y="122" class="text">Query</text>
  <path d="M185 115 H245" class="arrow"/>
  <rect x="250" y="80" width="180" height="70" rx="8" class="warn"/><text font-family="sans-serif" x="282" y="110" class="text">Ranked</text><text font-family="sans-serif" x="286" y="132" class="small">hybrid chunks</text>
  <path d="M430 115 H490" class="arrow"/>
  <rect x="495" y="80" width="145" height="70" rx="8" class="box"/><text font-family="sans-serif" x="536" y="122" class="text">LLM</text>
  <path d="M640 115 H700" class="arrow"/>
  <rect x="705" y="80" width="185" height="70" rx="8" class="box"/><text font-family="sans-serif" x="760" y="110" class="text">Answer</text><text font-family="sans-serif" x="733" y="132" class="small">from chosen chunks</text>

  <text font-family="sans-serif" x="40" y="218" class="text title">Noetic Reconciliation</text>
  <rect x="40" y="255" width="145" height="70" rx="8" class="box"/><text font-family="sans-serif" x="72" y="297" class="text">Query</text>
  <path d="M185 290 H225" class="arrow"/>
  <rect x="230" y="255" width="170" height="70" rx="8" class="soft"/><text font-family="sans-serif" x="256" y="284" class="text">Candidate</text><text font-family="sans-serif" x="252" y="306" class="small">field</text>
  <path d="M400 290 H440" class="arrow"/>
  <rect x="445" y="255" width="150" height="70" rx="8" class="accent"/><text font-family="sans-serif" x="476" y="284" class="text">Diffuse</text><text font-family="sans-serif" x="468" y="306" class="small">over graph</text>
  <path d="M595 290 H635" class="arrow"/>
  <rect x="640" y="255" width="145" height="70" rx="8" class="soft"/><text font-family="sans-serif" x="676" y="284" class="text">Basin</text><text font-family="sans-serif" x="665" y="306" class="small">selection</text>
  <path d="M785 290 H825" class="arrow"/>
  <rect x="830" y="255" width="110" height="70" rx="8" class="box"/><text font-family="sans-serif" x="858" y="284" class="text">LLM</text><text font-family="sans-serif" x="848" y="306" class="small">explains</text>
</svg>