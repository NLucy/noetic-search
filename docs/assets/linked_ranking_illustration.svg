<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Anchor-linked ranking illustration</title>
  <desc id="desc">Hybrid ranking preserves top anchors, then graph edges promote lower-ranked support chunks into the final compact return.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5b6472"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #d7dce5; stroke-width: 1.2; filter: url(#shadow); }
      .label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; font-size: 19px; font-weight: 700; }
      .small { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5b6472; font-size: 12px; }
      .rank { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; font-size: 14px; font-weight: 650; }
      .chunk-text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #293142; font-size: 12px; }
      .anchor { fill: #2364aa; stroke: #163f6b; }
      .promoted { fill: #1f8f6b; stroke: #14664c; }
      .dropped { fill: #b9c0cb; stroke: #828b99; }
      .candidate { fill: #ffffff; stroke: #c8ced8; }
      .edge { stroke: #8793a3; stroke-width: 2.2; opacity: 0.72; }
      .edge-strong { stroke: #2364aa; stroke-width: 3.6; opacity: 0.9; }
      .flow { stroke: #5b6472; stroke-width: 2.2; marker-end: url(#arrow); fill: none; }
      .note { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #3e4655; font-size: 12px; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1120" height="520" rx="16"/>

  <rect class="panel" x="32" y="42" width="286" height="420" rx="10"/>
  <text class="label" x="58" y="78">Hybrid candidates</text>
  <text class="small" x="58" y="102">Raw rank is useful, not final.</text>

  <g transform="translate(58 128)">
    <rect class="candidate" x="0" y="0" width="220" height="36" rx="7"/>
    <circle class="anchor" cx="18" cy="18" r="8"/>
    <text class="rank" x="36" y="23">1</text>
    <text class="chunk-text" x="68" y="23">anchor A</text>

    <rect class="candidate" x="0" y="46" width="220" height="36" rx="7"/>
    <circle class="anchor" cx="18" cy="64" r="8"/>
    <text class="rank" x="36" y="69">2</text>
    <text class="chunk-text" x="68" y="69">anchor B</text>

    <rect class="candidate" x="0" y="92" width="220" height="36" rx="7"/>
    <circle class="dropped" cx="18" cy="110" r="8"/>
    <text class="rank" x="36" y="115">3</text>
    <text class="chunk-text" x="68" y="115">isolated match</text>

    <rect class="candidate" x="0" y="138" width="220" height="36" rx="7"/>
    <circle class="dropped" cx="18" cy="156" r="8"/>
    <text class="rank" x="36" y="161">4</text>
    <text class="chunk-text" x="68" y="161">surface match</text>

    <rect class="candidate" x="0" y="184" width="220" height="36" rx="7"/>
    <circle class="dropped" cx="18" cy="202" r="8"/>
    <text class="rank" x="36" y="207">5</text>
    <text class="chunk-text" x="68" y="207">repeated text</text>

    <rect class="candidate" x="0" y="230" width="220" height="36" rx="7"/>
    <circle class="promoted" cx="18" cy="248" r="8"/>
    <text class="rank" x="36" y="253">9</text>
    <text class="chunk-text" x="68" y="253">support for A</text>

    <rect class="candidate" x="0" y="276" width="220" height="36" rx="7"/>
    <circle class="promoted" cx="18" cy="294" r="8"/>
    <text class="rank" x="36" y="299">14</text>
    <text class="chunk-text" x="68" y="299">support for B</text>
  </g>

  <path class="flow" d="M326 252 C366 252 376 252 414 252"/>

  <rect class="panel" x="414" y="42" width="292" height="420" rx="10"/>
  <text class="label" x="440" y="78">Evidence graph</text>
  <text class="small" x="440" y="102">Anchor links can promote lower-ranked support.</text>

  <g>
    <line class="edge-strong" x1="508" y1="176" x2="576" y2="276"/>
    <line class="edge-strong" x1="612" y1="184" x2="584" y2="336"/>
    <line class="edge" x1="508" y1="176" x2="612" y2="184"/>
    <line class="edge" x1="498" y1="306" x2="576" y2="276"/>
    <line class="edge" x1="642" y1="284" x2="584" y2="336"/>
    <line class="edge" x1="498" y1="306" x2="642" y2="284"/>

    <circle class="anchor" cx="508" cy="176" r="23"/>
    <text class="rank" x="501" y="181" fill="#fff">1</text>
    <text class="small" x="468" y="145">anchor A</text>

    <circle class="anchor" cx="612" cy="184" r="23"/>
    <text class="rank" x="605" y="189" fill="#fff">2</text>
    <text class="small" x="588" y="145">anchor B</text>

    <circle class="dropped" cx="498" cy="306" r="19"/>
    <text class="rank" x="491" y="311">3</text>
    <text class="small" x="458" y="342">isolated</text>

    <circle class="promoted" cx="576" cy="276" r="22"/>
    <text class="rank" x="565" y="281" fill="#fff">9</text>
    <text class="small" x="536" y="248">support</text>

    <circle class="promoted" cx="584" cy="336" r="22"/>
    <text class="rank" x="569" y="341" fill="#fff">14</text>
    <text class="small" x="608" y="358">support</text>

    <circle class="dropped" cx="642" cy="284" r="19"/>
    <text class="rank" x="635" y="289">5</text>
    <text class="small" x="626" y="324">repeat</text>
  </g>

  <text class="note" x="438" y="410">Strong anchor edges raise lower-ranked support.</text>
  <text class="note" x="438" y="434">Weak or repetitive chunks can fall out.</text>

  <path class="flow" d="M714 252 C754 252 764 252 802 252"/>

  <rect class="panel" x="802" y="42" width="286" height="420" rx="10"/>
  <text class="label" x="828" y="78">Final compact return</text>
  <text class="small" x="828" y="102">Anchors stay. Support moves up.</text>

  <g transform="translate(828 138)">
    <rect class="candidate" x="0" y="0" width="220" height="40" rx="7"/>
    <circle class="anchor" cx="20" cy="20" r="9"/>
    <text class="rank" x="40" y="25">1</text>
    <text class="chunk-text" x="72" y="25">anchor A</text>

    <rect class="candidate" x="0" y="54" width="220" height="40" rx="7"/>
    <circle class="anchor" cx="20" cy="74" r="9"/>
    <text class="rank" x="40" y="79">2</text>
    <text class="chunk-text" x="72" y="79">anchor B</text>

    <rect class="candidate" x="0" y="108" width="220" height="40" rx="7"/>
    <circle class="promoted" cx="20" cy="128" r="9"/>
    <text class="rank" x="40" y="133">9</text>
    <text class="chunk-text" x="72" y="133">support for A</text>

    <rect class="candidate" x="0" y="162" width="220" height="40" rx="7"/>
    <circle class="promoted" cx="20" cy="182" r="9"/>
    <text class="rank" x="40" y="187">14</text>
    <text class="chunk-text" x="72" y="187">support for B</text>

    <rect class="candidate" x="0" y="216" width="220" height="40" rx="7"/>
    <circle class="dropped" cx="20" cy="236" r="9"/>
    <text class="rank" x="40" y="241">3</text>
    <text class="chunk-text" x="72" y="241">best remaining</text>
  </g>

  <g transform="translate(828 420)">
    <circle class="anchor" cx="8" cy="0" r="6"/>
    <text class="small" x="22" y="5">anchor</text>
    <circle class="promoted" cx="132" cy="0" r="6"/>
    <text class="small" x="146" y="5">promoted</text>
  </g>
</svg>
